[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lumenpath"
dynamic = ["version"]
description = "A puzzle game about bending light: turn the mirrors until every crystal glows."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Syed Ali" }]
requires-python = ">=3.11"
keywords = ["game", "puzzle", "pygame", "light", "mirrors"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Puzzle Games",
]
dependencies = ["pygame-ce>=2.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lumenpath = "lumenpath.app:main"

[project.urls]
Homepage = "https://github.com/zeexduaa/lumenpath"
Issues = "https://github.com/zeexduaa/lumenpath/issues"

[tool.hatch.version]
path = "src/lumenpath/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
